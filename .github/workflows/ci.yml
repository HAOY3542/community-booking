name: Tests and release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned dependencies in a fresh runner
        run: python -m pip --isolated install --index-url https://pypi.org/simple -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: node --check community_booking/static/app.js
      - run: node --check community_booking/static/request.js
      - run: node --test tests/test_request.cjs
      - name: Verify inventory and recorded checksums
        run: python tools/check_release.py
      - name: Verify a clean staged copy
        shell: bash
        run: |
          python tools/check_release.py --stage "$RUNNER_TEMP/community-booking-source"
          cd "$RUNNER_TEMP/community-booking-source"
          python tools/check_release.py
          python -m community_booking.demo --init-only --seed
          python -m community_booking.backup --restore-check
